name: Build APK

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release (R8, signed with AOSP testkey)
        run: ./gradlew assembleRelease --stacktrace

      - name: Re-sign release (v1 + v2 + v3) and verify
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Signing $APK with $APKSIGNER"
          # AGP drops v1 for minSdk >= 24, so re-sign to force v1 alongside v2/v3.
          "$APKSIGNER" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias platform --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 23 \
            --out release-signed.apk "$APK"
          OUT=$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 release-signed.apk 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -E "v1 scheme.*: true"
          echo "$OUT" | grep -E "v2 scheme.*: true"
          echo "$OUT" | grep -E "v3 scheme.*: true"
          mv -f release-signed.apk "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.apk
          generate_release_notes: true
